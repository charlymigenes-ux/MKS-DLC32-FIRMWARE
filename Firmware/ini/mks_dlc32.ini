################################################################
# - 	            MKS DLC32 ESP32的默认参数设置
# - CPU Freq:160MHz         - for I2S calc
# - Flash Freq:80MHz        - for ESP32 Flash speed
# - Flash Mode: DOUT        - for ESP32 Flash mode
################################################################
[esp32_common]
platform = espressif32@3.2.0 
framework = arduino
board = esp32dev
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dout
; Sin el "-w" global: silenciaba TODAS las advertencias del compilador y
; ocultaba problemas reales. Se conservan solo los dos -Wno de MKS, que cubren
; el ruido conocido de este codigo.
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-Wno-unused-variable
	-Wno-unused-function
monitor_speed = 115200
build_src_filter = 
	+<*.h> +<*.s> +<*.S> +<*.cpp> +<*.c> +<*.ino> +<src/>
	-<.git/> -<data/> -<test/> -<tests/>

; For MKS DLC32
[env:mks_dlc32_v2_1]
platform = ${esp32_common.platform}
extends = esp32_common
board_build.partitions = huge_app.csv
upload_port = COM8
upload_speed = 921600
build_flags = ${esp32_common.build_flags}
			-D MACHINE_TYPE_DEFAULT
lib_deps = 
    TMCStepper@>=0.7.0,<1.0.0

; For MKS DLC32 CoreXY
[env:mks_dlc32_v2_1_CoreXY]
platform = ${esp32_common.platform}
extends = esp32_common
; Apuntaba a Grbl_Esp32/ld/mks_dlc32_partition.csv, que NO existe en este repo
; (solo hay mks_dlc32_8mb_partition.csv), asi que este env no llegaba ni a
; compilar. Se usa la misma tabla que su hermano v2_1: mismo hardware.
board_build.partitions = huge_app.csv
upload_port = COM8
upload_speed = 921600
build_flags = ${esp32_common.build_flags}
			-D MACHINE_TYPE_COREXY
lib_deps =
    TMCStepper@>=0.7.0,<1.0.0

; Hardware V1.0 (USE_BOARD_V2_0 comentado en el machine file) con flash de 8MB
; (el firmware original solo usaba 4MB) y una tabla de particiones con SPIFFS
; grande para la interfaz web. El puerto de subida se detecta automaticamente;
; para fijarlo: pio run -e mks_dlc32_8mb -t upload --upload-port <puerto>
[env:mks_dlc32_8mb]
platform = ${esp32_common.platform}
extends = esp32_common
board_build.partitions = Grbl_Esp32/ld/mks_dlc32_8mb_partition.csv
board_upload.flash_size = 8MB
upload_speed = 460800
build_flags = ${esp32_common.build_flags}
			-D MACHINE_TYPE_DEFAULT
lib_deps =
    TMCStepper@>=0.7.0,<1.0.0